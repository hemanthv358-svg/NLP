services:
  app:
    build: .
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      MYSQL_HOST: host.docker.internal
      CHROMA_DIR: /data/chroma
    volumes:
      - chroma-data:/data/chroma
    mem_limit: 2g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  chroma-data:
